  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ground:var(--bg-alt);border-radius:12px;margin:0 16px 24px\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:48px 40px 56px;display:flex;flex-direction:column;gap:20px\">\n      <span style=\"font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)\">Keep reading<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px\">\n        <sc-for list=\"{{ nachbarn }}\" as=\"n\" hint-placeholder-count=\"3\">\n          <a href=\"#\" sc-camel-on-click=\"{{ n.geh }}\" style=\"display:flex;flex-direction:column;gap:6px;padding:18px 20px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)\" style-hover=\"border-color:var(--brand-line);color:var(--text);box-shadow:0 20px 40px -24px rgba(10,98,207,.3)\"><span style=\"display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)\">{{ n.k }}<\u002Fspan><span style=\"font-size:15px;font-weight:600\">{{ n.t }}<\u002Fspan><\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;color:var(--muted);margin-top:8px\">FixedR is in a closed founders phase. <a href=\"#\" style=\"font-weight:600\">Join the waitlist<\u002Fa> to get in line, or read <a href=\"#\">why it shows you no money<\u002Fa>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ═══ Fußzeile ═══ -->\n  <footer style=\"background:var(--ink);color:var(--on-ink-muted);border-top:1px solid var(--ink-line);margin-top:auto\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:48px 40px 28px;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:40px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\"><img src=\"6b3f0d98-f68a-486b-90b8-2e4d7ebf1d9f\" alt=\"FixedR\" width=\"128\" style=\"display:block;width:128px;height:auto\"><span style=\"font-size:14px;max-width:32ch;line-height:1.55;color:var(--on-ink-faint)\">A trading cockpit for prop-firm accounts. Local-first, Windows, no cloud account.<\u002Fspan><\u002Fdiv>\n        <span style=\"display:flex;flex-direction:column;gap:9px;font-size:14px\"><span style=\"font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-ink-faint)\">Features<\u002Fspan><sc-for list=\"{{ alleSeiten }}\" as=\"f\" hint-placeholder-count=\"8\"><a href=\"#\" sc-camel-on-click=\"{{ f.geh }}\" style=\"color:var(--on-ink-muted)\" style-hover=\"color:var(--on-ink)\">{{ f.title }}<\u002Fa><\u002Fsc-for><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:24px;align-items:center;padding-top:20px;border-top:1px solid var(--ink-line);font-size:13px;color:var(--on-ink-faint)\"><span style=\"font-family:var(--mono)\">© FixedR<\u002Fspan><span style=\"margin-left:auto\">This site sets no cookies and loads nothing from third parties.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280},&quot;seite&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;banner&quot;,&quot;accounts&quot;,&quot;charts&quot;,&quot;workspaces&quot;,&quot;backtesting&quot;,&quot;journal&quot;,&quot;metrics&quot;,&quot;alerts&quot;,&quot;start&quot;],&quot;default&quot;:&quot;accounts&quot;,&quot;tsType&quot;:&quot;'banner' | 'accounts' | 'charts' | 'workspaces' | 'backtesting' | 'journal' | 'metrics' | 'alerts' | 'start'&quot;,&quot;section&quot;:&quot;Seite&quot;}}\">\nclass Component extends DCLogic {\n  state = { seite: undefined, menueOffen: undefined };\n  componentDidMount() {\n    let tries = 0;\n    const arm = () => {\n      const reveals = document.querySelectorAll(\"[data-reveal]\");\n      if (!reveals.length && tries++ < 40) return setTimeout(arm, 250);\n      this.ioR = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = \"1\"; e.target.style.transform = \"none\"; this.ioR.unobserve(e.target); } }), { rootMargin: \"0px 0px -12% 0px\" });\n      reveals.forEach(el => { if (el.getBoundingClientRect().top > innerHeight) { el.style.opacity = \"0\"; el.style.transform = \"translateY(28px)\"; } this.ioR.observe(el); });\n    };\n    arm();\n  }\n  componentWillUnmount() { this.ioR && this.ioR.disconnect(); }\n  componentDidUpdate(prev) {\n    if (prev.seite !== this.props.seite && this.state.seite !== undefined) this.setState({ seite: undefined, menueOffen: undefined });\n  }\n  renderVals() {\n    const h = React.createElement;\n    const seite = this.state.seite ?? this.props.seite ?? \"accounts\";\n    const istBanner = seite === \"banner\";\n    const menueOffen = this.state.menueOffen ?? istBanner;\n    const geh = s => e => { if (e && e.preventDefault) e.preventDefault(); this.setState({ seite: s, menueOffen: s === \"banner\" }); window.scrollTo(0, 0); };\n\n    // Strichsymbole 24×24, Strich 1.6 — dieselbe Familie wie Icon.astro.\n    const P = {\n      pen: \"M4 20h4l11-11a2.4 2.4 0 0 0-3.4-3.4L4.5 16.6V20zM14.5 7l2.5 2.5\",\n      grid: \"M4 4h7v6H4zM13 4h7v10h-7zM4 12h7v8H4zM13 16h7v4h-7z\",\n      bell: \"M6.5 10a5.5 5.5 0 0 1 11 0c0 4 1.5 5.5 1.5 5.5H5S6.5 14 6.5 10zM10 19a2.2 2.2 0 0 0 4 0\",\n      command: \"M4 6h16v12H4zM7 10h.01M11 10h.01M15 10h.01M8 14h8\",\n      replay: \"M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4.5V10h5.5M11 9.5l4 2.5-4 2.5z\",\n      resume: \"M5 4h4v16H5zM11 4l9 8-9 8z\",\n      idea: \"M12 3v2M5.6 5.6l1.4 1.4M3 12h2M19 12h2M17 7l1.4-1.4M9 18h6M10 21h4M8.5 14.5a4.5 4.5 0 1 1 7 0c-.8.9-1 1.6-1 2.5h-5c0-.9-.2-1.6-1-2.5z\",\n      sigma: \"M17 5H7l5.5 7L7 19h10M17 5v2M17 17v2\",\n      layers: \"M12 3.5 3.5 8l8.5 4.5L20.5 8 12 3.5zM3.5 13l8.5 4.5 8.5-4.5\",\n      archive: \"M3.5 5h17v4h-17zM5 9v10h14V9M10 13h4\",\n      pulse: \"M3 12h4l2.5-6 3 12 2.5-6h6\",\n      shield: \"M12 3.5 5 6.5v5c0 4.2 3 7.6 7 9 4-1.4 7-4.8 7-9v-5zM9 12l2 2 4-4\",\n      compass: \"M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM15 9l-2 5-4 1 2-5z\",\n      path: \"M3 17c3.5 0 4-8 7.5-8s4 8 7.5 8M16 14l3 3-3 3\",\n      book: \"M5 4.5h6.5V20H5zM12.5 4.5H19V20h-6.5zM15.5 4.5v5l1.5-1.2 1.5 1.2v-5\",\n      ladder: \"M7 3v18M17 3v18M7 7h10M7 12h10M7 17h10\",\n      statement: \"M6 3.5h9l4 4V20.5H6zM15 3.5v4h4M9 12h6M9 16h4\",\n      chart: \"M4 20V9M9.5 20V4M15 20v-7M20.5 20V11M3 20h18\",\n      clock: \"M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM12 8v4.5l3 2\"\n    };\n    const icon = (name, size = 16, sw = 1.6) => h(\"svg\", { width: size, height: size, viewBox: \"0 0 24 24\", fill: \"none\", stroke: \"currentColor\", strokeWidth: sw, strokeLinecap: \"round\", strokeLinejoin: \"round\" }, h(\"path\", { d: P[name] }));\n\n    const FEATURE = [\n      [\"accounts\", \"Accounts and risk\", \"layers\", \"The trade\"],\n      [\"charts\", \"Charts and drawing\", \"pen\", \"The trade\"],\n      [\"workspaces\", \"Workspaces and timeframes\", \"grid\", \"The trade\"],\n      [\"backtesting\", \"Backtesting and replay\", \"replay\", \"Practice and review\"],\n      [\"journal\", \"Journal\", \"book\", \"Practice and review\"],\n      [\"metrics\", \"Metrics in R\", \"chart\", \"Practice and review\"],\n      [\"alerts\", \"Alerts and calendar\", \"bell\", \"Around it\"],\n      [\"start\", \"Getting started\", \"compass\", \"Around it\"]\n    ].map(([slug, title, ic, lane]) => ({ slug, title, ic, lane, geh: geh(slug) }));\n\n    const lanes = [\n      { name: \"Your working surface\", icon: \"pen\", items: [\n        [\"pen\", \"Charts and drawing tools\", \"60+ tools, saved automatically, identical in replay\", \"charts\"],\n        [\"grid\", \"Layouts and custom timeframes\", \"Saved arrangements, intervals like M90\", \"workspaces\"],\n        [\"bell\", \"Alerts\", \"Price levels, trendlines, candle patterns — and they reach your phone\", \"alerts\"],\n        [\"command\", \"Command palette and calendar\", \"Ctrl+K finds everything; the economic calendar sits in a pane\", \"start\"]\n      ]},\n      { name: \"Test and build a strategy\", icon: \"replay\", items: [\n        [\"clock\", \"Replay controls\", \"Play, pause, step, jump; several symbols on one clock\", \"backtesting\"],\n        [\"resume\", \"Sessions that resume\", \"Pick a backtest up where you left it\", \"backtesting\"],\n        [\"idea\", \"A strategy from an idea\", \"Describe a setup, get a rule set you can test\", \"backtesting\"],\n        [\"sigma\", \"Expectancy in R\", \"Per symbol, per week, per session\", \"metrics\"]\n      ]},\n      { name: \"Accounts over a career\", icon: \"layers\", items: [\n        [\"archive\", \"Account lifecycle\", \"Archive a failed challenge, the history stays\", \"accounts\"],\n        [\"pulse\", \"Live data guard\", \"Green only when candles actually arrive, and it repairs itself\", \"accounts\"],\n        [\"shield\", \"Firm rule profiles\", \"Maintained rule sets per prop firm, not hand-entered numbers\", \"accounts\"],\n        [\"compass\", \"Guided setup\", \"Six guides for six purposes, plus a todo panel until you are done\", \"start\"]\n      ]},\n      { name: \"On the way\", icon: \"path\", items: [\n        [\"book\", \"Automatic trade documentation\", \"The plan next to the result, without typing it up\", \"journal\"],\n        [\"ladder\", \"News protection\", \"An escalation ladder — a net, not a guarantor\", \"alerts\"],\n        [\"statement\", \"The monthly guardian statement\", \"What the tool quietly prevented over a month\", \"metrics\"]\n      ]}\n    ].map(l => ({ name: l.name, icon: icon(l.icon, 15), items: l.items.map(([ic, title, text, slug]) => ({ icon: icon(ic, 15, 1.5), title, text, geh: geh(slug) })) }));\n\n    const navi = [[\"product\", \"Product\"], [\"methodology\", \"Methodology\"], [\"trust\", \"Trust\"], [\"manifesto\", \"Manifesto\"], [\"faq\", \"FAQ\"], [\"blog\", \"Blog\"]].map(([id, name]) => ({\n      name, pfeil: id === \"product\", geh: id === \"product\" ? geh(\"banner\") : e => e.preventDefault(),\n      pfeilStil: `margin-left:5px;transition:transform .2s;transform:rotate(${menueOffen ? 180 : 0}deg)`,\n      rein: () => this.setState({ menueOffen: id === \"product\" }),\n      style: `display:inline-flex;align-items:center;padding:6px 0;color:${(id === \"product\" && (menueOffen || !istBanner)) ? \"var(--brand-on-ink)\" : \"var(--on-ink)\"};font-weight:${id === \"product\" && !istBanner ? 600 : 500}`\n    }));\n\n    // ── Seiteninhalte (Wortlaut aus src/pages/product/*.astro, gekürzt, nicht erweitert)\n    const pt = (b, t) => ({ b, t });\n    const SEITEN = {\n      accounts: { eyebrow: \"The trade\", h1: \"The rules follow the trader, not the login.\", tabs: [\"Order\", \"Accounts\", \"Rules\"], chrom: \"3 accounts · 2 configured\",\n        lede: \"A prop trader rarely has one account. Different firms, different platforms, different balances — and a limit breached on one of them ends the same way regardless of what the other three were doing. One ticket, checked and sized per account, closes that gap.\",\n        claim: \"The rules belong to the trader, not to a login. FixedR applies the same order across every account you hold, each one sized from its own risk, its own firm's limits already checked.\",\n        bloecke: [\n          { h2: \"One order, several accounts, no guessing\", ps: [\"Place the order once. FixedR sizes it for each account from that account's own risk — never copied blindly from another one, because two accounts of different sizes with the same contract count are not taking the same risk. You choose which accounts the order goes to: all of them, or a selection.\", \"An account that has not been configured does not get a guessed size. It stops the distribution with a loud error instead — silence here would mean a position nobody sized on purpose.\"], punkte: [pt(\"Sized per account.\", \"Each ticket computed from that account's own risk, not copied.\"), pt(\"Pick the set.\", \"All accounts, or a chosen few, per order.\"), pt(\"No silent guess.\", \"An unconfigured account halts the order with an explicit error.\")] },\n          { h2: \"Firm rules, checked before the order leaves\", ps: [\"Drawdown limit, daily loss limit, flatten time — every prop firm writes its own version of these, and a breach on any one account can end that account on the spot. FixedR checks the rule for each account before the order is sent, on every account at once, not after a fill comes back and it is too late to undo.\"], punkte: [pt(\"Drawdown and daily loss.\", \"Checked against the account's own limit, not a generic one.\"), pt(\"Flatten time.\", \"Enforced on the account it belongs to, not remembered separately by you.\"), pt(\"Before, not after.\", \"The check runs before the order leaves, on every account at once.\")] },\n          { h2: \"Rule profiles, not hand-typed numbers\", ps: [\"Each prop firm's rule set lives as a maintained profile rather than a set of figures you transcribe from a PDF and hope you got right. Attach the profile to the account and the limits above are the firm's own, kept current.\"] },\n          { h2: \"Payout protection\", ps: [\"Once an account is eligible for payout, FixedR can pause trading on it until the money is actually out. Most risk tooling exists to protect you from a loss. This protects a gain that already happened, from a trade placed after the fact that undoes it.\"] },\n          { h2: \"Risk that follows a rule, not a mood\", ps: [\"1 R does not have to be the same fraction forever. Smaller in a drawdown, larger near a target — written into the account profile as a rule ahead of time, not decided in the moment a trade looks tempting.\"] },\n          { h2: \"An account lifecycle that keeps its history\", ps: [\"A failed challenge is archived, not deleted — the trades and the statistics stay reachable. Hiding a still-open account asks first, so a mis-click never removes something you are still trading.\"], punkte: [pt(\"Archived, not erased.\", \"A failed challenge keeps its full record.\"), pt(\"Asks first.\", \"Hiding a live account needs confirmation, not a single click.\"), pt(\"Reversible.\", \"A switch brings closed accounts back into view.\")] },\n          { h2: \"Watching the data feed, not just the account\", ps: [\"An account only shows green when candles are actually arriving. If the feed goes quiet, it turns yellow instead of staying falsely green, and three stages of self-healing try to repair the connection — usually before you notice anything happened.\"] },\n          { h2: \"What still depends on the broker\", ps: [\"The stop itself sits with the broker, not with us. If FixedR were to go offline, an order already placed with a stop attached still closes where it was set — the software watches and enforces the rule, it does not stand between your stop and the market.\"] }\n        ] },\n      charts: { eyebrow: \"The trade\", h1: \"The tool you write the analysis with.\", tabs: [\"NQ · M15\", \"ES · M15\", \"+\"], chrom: \"62 tools · auto-saved\",\n        lede: \"A level, a trendline, a note on the chart — none of it means anything if it disappears the moment you close the window. Charts in FixedR are where the analysis is drawn, saved, and trusted to still be there tomorrow.\",\n        claim: \"An analysis that only exists in your head is not an analysis yet. FixedR is the tool you write it down with, and it keeps what you wrote.\",\n        bloecke: [\n          { h2: \"Over sixty tools\", ps: [\"Trendlines, Fibonacci tools, notes pinned directly to the chart, a position calculator, and more besides — the drawing kit is not a short list of the obvious ones. Whatever the setup needs marked, there is a tool built for marking it, rather than a workaround with the two or three that shipped.\"] },\n          { h2: \"Saved without asking\", ps: [\"Every drawing is saved automatically and restored the next time you open the chart. Closing a window is not a decision to throw away the work on it — an analysis you spent twenty minutes building is exactly where you left it.\"] },\n          { h2: \"The same tools, live and in replay\", ps: [\"A trendline drawn during replay is not a lesser, throwaway kind of object compared to one drawn live — it is the same kind of object, made with the same tool, on the same chart. That is what makes practice actually transferable.\"], punkte: [pt(\"One tool set.\", \"No separate, cut-down drawing kit for replay.\"), pt(\"Same object type.\", \"A replay drawing and a live drawing are equal, not similar.\")] },\n          { h2: \"Style once, reuse everywhere\", ps: [\"Style templates, multi-select, and grouping mean a recurring annotation is not re-styled by hand every time it appears. Set the look once, apply it to the next twenty lines, and move the group as one thing when the chart needs rearranging.\"], punkte: [pt(\"Style templates.\", \"A look defined once, applied to every new drawing of that kind.\"), pt(\"Multi-select and grouping.\", \"Several drawings moved or restyled as one.\")] },\n          { h2: \"Indicators that come with the platform\", ps: [\"Support and resistance, ICT sessions, news markers, candle patterns, market structure, and fair-value gaps are part of the standard set. They sit on the chart next to your own drawings rather than in a separate panel you have to reconcile against them.\"] },\n          { h2: \"A drawing that belongs to a trade\", ps: [\"Click an object on the chart and it is attached to a trade, not just to a window position. The mark you made to justify an entry stays connected to the entry it justified, long after the chart has scrolled on.\"] },\n          { h2: \"What the tools do not do\", ps: [\"Tools do not replace a strategy. What they do is make an existing one checkable — a setup you can point to on the chart is a setup you can argue with, which is the only kind worth trading.\"] }\n        ] },\n      workspaces: { eyebrow: \"The trade\", h1: \"An arrangement of windows becomes a structure.\", tabs: [\"London open\", \"NY session\", \"+\"], chrom: \"layout 3 of 10 · saved\",\n        lede: \"Anyone can put four charts on a screen. The question that decides whether it helps is what each one is doing there — and whether the setup survives being closed and reopened tomorrow.\",\n        claim: \"An arrangement of windows is not yet a structure. Naming what each chart is for turns it into one.\",\n        bloecke: [\n          { h2: \"One symbol, several timeframes, side by side\", ps: [\"The same instrument across multiple timeframes at once, each tile carrying its own symbol, timeframe, and indicators. Nothing forces the tiles to match each other — a workspace can just as easily hold four different symbols as one symbol four times over.\"] },\n          { h2: \"A role, not a position\", ps: [\"Every chart in a workspace can be given a role — HTF, MTF, LTF. Synchronisation follows that role, not the tile's position on screen. Move the windows around and the higher timeframe is still the higher timeframe; it does not quietly become the middle one because it changed corners.\", \"That is the difference between an arrangement of windows and a named structure. The charts belong together because you said what each one is for.\"], punkte: [pt(\"HTF, MTF, LTF.\", \"A role assigned per chart, independent of screen position.\"), pt(\"Sync follows the role.\", \"Rearranging tiles does not reassign what they mean.\")] },\n          { h2: \"Ten layouts\", ps: [\"Splits, a 2×2 grid, and several more besides — the shape of the workspace is chosen from a set built for how charts actually get compared, not squeezed into a single fixed grid.\"] },\n          { h2: \"Saved arrangements\", ps: [\"A workspace is a state you return to, not something rebuilt from scratch every morning. Close it, reopen it, and the tiles, roles, and layout are exactly where you left them.\"] },\n          { h2: \"Timeframes the platforms don't offer\", ps: [\"Custom timeframes such as M90 sit alongside the standard ones — intervals the underlying platforms do not provide on their own, available here as an ordinary choice on any tile.\"] },\n          { h2: \"What more charts do not buy you\", ps: [\"More charts are not more clarity — the role is. Four windows with nothing said about what each is for add noise; the same four windows with HTF, MTF and LTF assigned add up to a single statement about the market.\"] }\n        ] },\n      backtesting: { eyebrow: \"Practice and review\", h1: \"Trade the past at your own pace.\", tabs: [\"Replay · NQ\", \"Session 14\", \"+\"], chrom: \"resumes where you stopped\",\n        lede: \"Most traders test a strategy by scrolling a chart and imagining the entry. That measures memory, not method. Replay hides the future, hands you the clock, and makes you commit before you can see what happens next.\",\n        claim: \"A backtest is only worth something if the trade goes in the way a real one does. So in FixedR it does — same order ticket, same mandatory stop, same size computed from your risk, same result in R.\",\n        bloecke: [\n          { h2: \"The clock is yours\", ps: [\"Play, pause, step one candle, or run at a speed you pick. Jump forward to the session you want to study — or backwards, when you realise the setup started earlier than you thought. The point is not to finish quickly; it is to make the same decision you would make live, with the same information you would have live.\"], punkte: [pt(\"Step and speed.\", \"One candle at a time, or continuous at your chosen tempo.\"), pt(\"Jump either way.\", \"Forward to a session, backwards when the setup began earlier.\"), pt(\"Several symbols, one clock.\", \"Correlated markets move together, as they did.\"), pt(\"Draw as you would live.\", \"The same tools, on the same charts, saved the same way.\")] },\n          { h2: \"Orders that behave like orders\", ps: [\"Market, limit and stop entries, a stop-loss and a target, partial exits when you take something off. The position size is computed from your stop distance and the risk you chose — exactly as it is on a live account, because it is the same mechanism, not a simplified copy of it.\", \"A test where you enter with a round number of contracts and no stop measures a different strategy than the one you actually trade. Here the constraint that shapes your live trading — no stop, no trade — shapes the test too.\"] },\n          { h2: \"A session you can come back to\", ps: [\"Testing a market properly takes longer than one sitting. A replay session in FixedR keeps its state: the symbol, the point in time, the charts you arranged, the trades you already took. You close it and pick it up where you stopped.\"], punkte: [pt(\"State survives.\", \"Time, charts, trades — the session is a place, not a run.\"), pt(\"Its own evaluation.\", \"Each session and symbol gets its own read-out in R.\")] },\n          { h2: \"From an idea to something testable\", ps: [\"Describe the setup in your own words — the conditions, what invalidates it, where the stop goes — and get back a rule set written down explicitly enough to run against real candles.\", \"An unwritten strategy cannot be broken, and therefore cannot be improved either. The strategies that ship with FixedR work the same way: their trades are drawn on the chart, entry, stop and target as bands, so you check the mechanism by looking at it rather than by trusting a summary row.\"] },\n          { h2: \"What the record is for\", ps: [\"Every replay trade lands in the same record as a live one, in R. A month of practice and a month of trading are comparable, and the routine you build in replay is the routine you already know when it counts. The honest limit belongs here too — a replay is the market without the money. It trains the method. It does not simulate the fear.\"] }\n        ] },\n      journal: { eyebrow: \"Practice and review\", h1: \"The journal fills itself, because the order was set here first.\", tabs: [\"Journal\", \"Entry #412\", \"\"], chrom: \"written at entry · closed 10:14\",\n        lede: \"FixedR sits where the entry happens. It sets the order, sizes it from the risk you fixed, and keeps writing while the trade is open — not afterwards, from memory. There is no second, later version of the trade for a rule to quietly bend in.\",\n        claim: \"A journal that requires typing gets filled for a week and then stops. One that fills itself is still there in month three.\",\n        bloecke: [\n          { h2: \"No second version of the trade\", ps: [\"FixedR places the order. It computes the size from the stop you drew and the risk you chose, and the record keeps running while the position is open. The sizing that happened is the sizing that gets logged — not a number typed in afterwards from memory, in whichever direction memory happens to round.\"] },\n          { h2: \"The plan next to the outcome\", ps: [\"What you intended to do and what actually happened sit in the same place, without a separate step to write either one up. The plan was the order ticket; the outcome is the trade as it closed. Comparing them is reading two fields on one entry.\"] },\n          { h2: \"Setup, rule adherence, outcome\", ps: [\"Three things carry an entry, and each answers a different question.\"], punkte: [pt(\"Setup.\", \"Which named idea the trade belongs to, recorded at entry, not decided in hindsight.\"), pt(\"Rule adherence.\", \"Whether the trade matched the plan written for it — size, stop, target.\"), pt(\"Outcome.\", \"What the trade closed at, in R, next to the setup and the check it belongs to.\")] },\n          { h2: \"The chart, at the moment\", ps: [\"Every entry keeps a screenshot of the chart as it looked when the decision was made — not a chart pulled up later and redrawn until the setup looks cleaner than it was. That is the difference between a record and a reconstruction.\"] },\n          { h2: \"Tags and strategy\", ps: [\"Every entry belongs to a named strategy, and can carry tags on top of it. A review that asks how the pullback strategy did this month is asking a question the label already answers.\"] },\n          { h2: \"Notes, and the part that never gets automated\", ps: [\"Below the fields there is a plain-text note, for whatever the automatic part left out — why you actually took the trade, what the session felt like. Nothing enforces a structure there; the format is your own words.\", \"Journaling usually fails for a boring reason: it is work that happens after the trade, exactly when there is the least appetite for it. A journal that fills itself is the one still there after four weeks.\"] }\n        ] },\n      metrics: { eyebrow: \"Practice and review\", h1: \"One record that survives changing accounts.\", tabs: [\"Metrics\", \"Calendar\", \"Per symbol\"], chrom: \"all accounts · in R\",\n        lede: \"Every currency statistic resets when your account size changes. Average win, worst day, best month — all of them stop being comparable the moment you scale. Expressed as multiples of the risk you fixed yourself, they never do.\",\n        claim: \"A number is only useful if it means the same thing next year. Measured in R, yours does — the same routine reads identically on a small account and a large one.\",\n        bloecke: [\n          { h2: \"The numbers, and what each one is for\", ps: [\"Not a wall of tiles. A short set that answers the questions a trader actually asks after a week: did I win more often than I lost, was the average winner bigger than the average loser, and did the whole thing add up to anything.\"], punkte: [pt(\"Winrate.\", \"How often, not how much — on its own it decides nothing.\"), pt(\"Average R.\", \"What a typical trade returned, measured in your own unit of risk.\"), pt(\"Expectancy.\", \"The two above combined: what one trade is worth on average.\"), pt(\"Net percentage.\", \"The account's own yardstick, the one your firm also uses.\")] },\n          { h2: \"Per symbol, per week, per session\", ps: [\"An aggregate hides the thing you need to change. Broken down by symbol, it usually turns out that the edge lives in two of them and the rest is noise with commission attached. Broken down by week, a run of discipline looks different from a run of luck. Broken down by replay session, practice stops being a feeling about how it went.\"] },\n          { h2: \"The calendar\", ps: [\"Days as cells, in R. A month you can read in two seconds: where the streaks sat, which day broke the rhythm, how much of the result came from one afternoon. Scale from a small evaluation account to a large funded one and the calendar reads exactly the same.\", \"It is also the cheapest honesty check there is. A single oversized cell says more about a month than any average does.\"] },\n          { h2: \"Streaks and the deepest hole\", ps: [\"Two numbers that decide whether a strategy is tradeable by you rather than in principle: the longest run of losses it has actually produced, and the deepest drawdown it went through on the way to its result. A method with a fine average and a run you cannot sit through is not a method you can use.\"] },\n          { h2: \"The patterns you cannot see from inside\", ps: [\"Behaviour shows up in the data long before you would admit it in words. Position size creeping up after two losses. Losers held several times longer than winners. A measurably worse hour late in the day. The record states it plainly, out of your own trades.\", \"The order matters: the mirror first, the interpretation second, and only as an offer. The record tells you what you did. What to do about it stays your call.\"] },\n          { h2: \"The monthly statement of what did not happen\", ps: [\"Protection is invisible when it works. Once a month, the record adds up the things that quietly did not go wrong: orders held to the exact size, stops that were never moved, sessions stopped at the limit instead of continued. It is the answer to the only question that matters when a subscription renews — what is this actually doing for me.\"] }\n        ] },\n      alerts: { eyebrow: \"Around it\", h1: \"It reaches you before you're back at the screen.\", tabs: [\"NQ · M15\", \"Alerts · 3\", \"Calendar\"], chrom: \"phone paired\",\n        lede: \"FixedR watches the charts even when you don't. Set an alert once, on the object you already work with — not a number typed into a list you have to remember — and it comes to you, instead of you having to go looking for it.\",\n        claim: \"An alert only matters if it reaches you before the level does. FixedR sends it to your phone, not just to a chart you have already stopped watching.\",\n        bloecke: [\n          { h2: \"Attached to what you drew, not typed in\", ps: [\"A price-level alert fires on a level you marked on the chart. A trendline alert is the same idea for a slanted line: the trigger follows the line's current value, because it is attached to the drawn object, not to a number captured the day you drew it.\"], punkte: [pt(\"Price levels.\", \"Fires on a level marked once, directly on the chart.\"), pt(\"Trendlines.\", \"Attached to the drawn line, so the trigger moves as the line does.\"), pt(\"Candle patterns.\", \"Recognised shapes, without a screen to watch for them.\"), pt(\"Custom ranges.\", \"A band you define, not a single price.\")] },\n          { h2: \"On your phone, without a second account\", ps: [\"Alerts push to your phone even when the cockpit is closed. Pairing a phone is a QR code scanned once, cockpit to handset — there is no account to create with us, and no login beyond the one already on your desk.\", \"The phone app is built for Android. There is no iOS version — that is the honest state of it today, not a footnote to skip past.\"] },\n          { h2: \"The calendar you're already looking at\", ps: [\"An economic calendar panel — by day, week or month — sits in the same window as your charts, so checking for news is not a separate errand on a separate site. On the chart itself, markers show exactly where a release fell, on the candles it moved.\"] },\n          { h2: \"“A net, not a guarantor.”\", ps: [\"News protection works as a ladder, not a single switch: the closer a high-impact release gets, the stricter the constraint becomes — size steps down first, then new entries stop, then an open position can be flattened if the release is close enough and large enough. It catches most of what would otherwise catch you; it does not promise that every release ends quietly.\"] },\n          { h2: \"Who decides\", ps: [\"The server that watches your alerts and your calendar never sends an order. It watches, and it tells you. The decision to act — resize, exit, sit still — stays with you, and the position itself lives with your broker, not with FixedR. An alert is a reminder, not a safeguard. What actually holds a trade is the stop sitting at the broker.\"] }\n        ] },\n      start: { eyebrow: \"Around it\", h1: \"Your first trade in R, inside fifteen minutes.\", tabs: [\"Start\", \"Order\", \"Guides · 2/6\"], chrom: \"demo account connected\",\n        lede: \"Connect a demo account, place a trade sized in R, and watch the size calculation and the distance-to-limit display do their job once. That sequence is the entire pitch of the product, experienced rather than described — so it happens first, not after a settings screen.\",\n        claim: \"Fifteen minutes should teach you what the cockpit does, not what its menus are called.\",\n        bloecke: [\n          { h2: \"The first fifteen minutes decide\", ps: [\"Connect a demo account, set a first trade sized in R, and see the size calculation and the limit display work once, on a real order. Ask someone to configure indicators before any of that happens, and the moment is gone before it started — the guided setup exists to put the experience first and the configuration after it.\"] },\n          { h2: \"Not another tool you invest in and hope\", ps: [\"Backtesting and journal tools are, as a category, investment tools: you pay, you put in weeks of work, and only later find out whether it paid off. FixedR is built to be different at the very first trade. Click an entry and a stop, choose a fraction of a unit of risk, and the size is computed on the spot; the trade then runs in R, with the distance to the daily limit sitting right next to it.\"] },\n          { h2: \"Six guides, each with one job\", ps: [\"A generic click-through teaches “next, next, next” and nothing about why. Six purpose-built guides replace it instead — connecting an account, placing a sized trade, reading the limit display, and the rest — each with a speech bubble that points at the real control on the real screen, not at a screenshot of it.\"] },\n          { h2: \"A todo panel, not a one-time tour\", ps: [\"The guides are not something you dismiss and never see again. A todo panel keeps the same list as a permanent fixture: what is still open, with a direct jump to wherever it lives. Hint points sit on the parts of the cockpit whose setup isn't finished yet.\", \"The start dashboard itself decides what it's looking at: a fresh cockpit shows a setup checklist, a cockpit already running shows the week's numbers instead.\"] },\n          { h2: \"Ctrl+K, and no menu to learn\", ps: [\"A command palette opens with Ctrl+K and searches the whole application as text — every account, every setting, every panel. Finding something is typing its name, not remembering which menu it was filed under.\"] },\n          { h2: \"Installed once, on your own machine\", ps: [\"FixedR is a Windows application with an installer. No cloud account holds your setup, no browser tab keeps it alive — it runs on the machine in front of you, the same way it did the day before.\", \"Fifteen minutes teaches the mechanics: connecting an account, sizing a trade, reading a limit. It does not teach the strategy — deciding what to trade and when stays your work, same as it always was.\"] }\n        ] }\n    };\n\n    const istSeite = !istBanner && !!SEITEN[seite];\n    const roh = SEITEN[seite] || SEITEN.accounts;\n    const meta = FEATURE.find(f => f.slug === (istSeite ? seite : \"accounts\"));\n    const s = {\n      ...roh, iconGross: icon(meta.ic, 72, 1.2), chromRechts: roh.chrom,\n      tabs: roh.tabs.filter(Boolean).map((name, i) => ({ name, stil: `padding:3px 9px;border-radius:4px;font-size:11px;${i === 0 ? \"background:var(--ink-3);border:1px solid var(--ink-line-2);color:var(--on-ink)\" : \"color:var(--on-ink-faint)\"}` })),\n      bloecke: roh.bloecke.map((b, i) => ({ nr: String(i + 1).padStart(2, \"0\"), h2: b.h2, ps: b.ps, hatPunkte: !!b.punkte, punkte: (b.punkte || []).map((p, j) => ({ nr: String(j + 1).padStart(2, \"0\"), ...p })) }))\n    };\n    const ist = Object.fromEntries(Object.keys(SEITEN).map(k => [k, seite === k]));\n    const idx = FEATURE.findIndex(f => f.slug === seite);\n    const nachbarn = [];\n    if (idx > 0) nachbarn.push({ k: `← ${FEATURE[idx - 1].lane}`, t: FEATURE[idx - 1].title, geh: FEATURE[idx - 1].geh });\n    if (idx >= 0 && idx < FEATURE.length - 1) nachbarn.push({ k: `${FEATURE[idx + 1].lane} →`, t: FEATURE[idx + 1].title, geh: FEATURE[idx + 1].geh });\n    nachbarn.push({ k: \"All eight\", t: \"Everything the cockpit does\", geh: geh(\"banner\") });\n\n    // ── Bilddaten der Ausschnitte. Kerzen: kein Gruen/Rot — hell = auf, gedaempft = ab.\n    const kerze = (n, top, hoehe, left0, breite) => Array.from({ length: n }, (_, i) => {\n      const y = top + Math.sin(i * .55) * 12 + i * .9 + (i % 3) * 4, hh = 10 + (i * 7) % 18, auf = (i * 7) % 5 < 3;\n      return { stil: `position:absolute;left:${left0 + i * breite}%;top:${y}%;width:${breite * .55}%;height:${hh}%;border-radius:1px;background:${auf ? \"var(--on-ink-muted)\" : \"var(--ink-line-2)\"};box-shadow:0 -${hh * .25}px 0 0 ${auf ? \"var(--on-ink-muted)\" : \"var(--ink-line-2)\"},0 ${hh * .2}px 0 0 ${auf ? \"var(--on-ink-muted)\" : \"var(--ink-line-2)\"};opacity:${auf ? .85 : 1}` };\n    });\n    const kerzen = kerze(28, 24, 0, 4, 3.3), kerzenKlein = kerze(16, 30, 0, 6, 5.6);\n    const fib = [[\"0.5\", 30], [\"0.618\", 41], [\"0.786\", 56]].map(([name, y]) => ({ name, stil: `position:absolute;left:52%;right:8%;top:${y}%;border-top:1px dashed var(--ink-line-2);display:flex;justify-content:flex-end;padding-top:2px` }));\n    const werkzeuge = [\"pen\", \"grid\", \"sigma\", \"bell\", \"clock\", \"command\"].map((n, i) => `width:24px;height:24px;border-radius:5px;background:${i === 0 ? \"var(--brand-on-ink)\" : \"var(--ink-2)\"};border:1px solid var(--ink-line-2)`);\n    const konten = [[\"FTMO 100k\", \"Rule profile · FTMO Swing\", \"3 contracts\", true], [\"Apex 150k\", \"Rule profile · Apex PA\", \"4 contracts\", true], [\"TopStep 50k\", \"not configured\", \"halted · no size guessed\", false]].map(([name, regel, wert, ok]) => ({\n      name, regel, wert, stil: `display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;background:var(--ink-3);border:1px solid ${ok ? \"var(--ink-line-2)\" : \"var(--warn)\"}`, wertStil: ok ? \"color:var(--brand-on-ink);font-weight:600\" : \"color:var(--warn);font-size:10px;text-align:right\"\n    }));\n    const rollen = [[\"HTF\", \"H4\", true, \"grid-row:span 2\"], [\"MTF\", \"M15\", false, \"\"], [\"LTF\", \"M1\", false, \"\"]].map(([rolle, tf, aktiv, extra], i) => ({\n      rolle, tf, stil: `${extra};display:flex;flex-direction:column;justify-content:space-between;padding:10px;border-radius:8px;background:var(--ink-2);border:1px solid ${aktiv ? \"var(--brand-on-ink)\" : \"var(--ink-line-2)\"}`,\n      badge: `padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.06em;${aktiv ? \"background:var(--brand-on-ink);color:#fff\" : \"background:var(--ink-3);border:1px solid var(--ink-line-2);color:var(--on-ink-muted)\"}`,\n      balken: Array.from({ length: 12 }, (_, j) => `flex:1;height:${30 + ((j * 37 + i * 11) % 60)}%;border-radius:1px;background:${(j * 7) % 3 ? \"var(--ink-line-2)\" : \"var(--on-ink-faint)\"}`)\n    }));\n    const replayKnoepfe = [[\"⏮\", false], [\"▶\", true], [\"⏸\", false], [\"⏭\", false], [\"›|\", false]].map(([icon, aktiv]) => ({ icon, stil: `width:30px;height:30px;display:grid;place-items:center;border-radius:6px;font-size:12px;${aktiv ? \"background:var(--brand-on-ink);color:#fff\" : \"background:var(--ink-3);border:1px solid var(--ink-line-2);color:var(--on-ink-muted)\"}` }));\n    const plan = [[\"Setup\", \"Pullback\"], [\"Entry\", \"17,830\"], [\"Stop\", \"17,812 · 1.0 R\"], [\"Target\", \"17,866 · 2.0 R\"]].map(([k, v]) => ({ k, v }));\n    const ergebnis = [[\"Closed\", \"17,861\", \"color:var(--on-ink)\"], [\"Result\", \"+1.7 R\", \"color:var(--brand-on-ink);font-weight:600\"], [\"Stop moved\", \"no\", \"color:var(--on-ink)\"], [\"Rule check\", \"held\", \"color:var(--on-ink)\"]].map(([k, v, stil]) => ({ k, v, stil }));\n    const kpis = [[\"WINRATE\", \"54%\"], [\"AVG R\", \"+0.62\"], [\"EXPECTANCY\", \"+0.34 R\"], [\"NET\", \"+6.8%\"]].map(([name, wert], i) => ({ name, wert, stil: `display:flex;flex-direction:column;gap:4px;padding:14px 16px;${i ? \"border-left:1px solid var(--ink-line)\" : \"\"}` }));\n    const werte = [0, 1.2, -0.4, 2.1, 0, 0, 0, 0.8, 1.9, -1, 0.5, 3.2, 0, 0, -0.6, 2.4, 1.1, 0, 0.9, 1.4, 0, 0, -0.3, 1.8, 2.6, 0.7, -1.2, 0];\n    const monat = werte.map(w => { const leer = w === 0, stark = w >= 1.8; return { wert: leer ? \"\" : (w > 0 ? \"+\" : \"−\") + Math.abs(w).toFixed(1), stil: `display:grid;place-items:center;height:26px;border-radius:4px;font-size:10px;font-weight:500;background:${leer ? \"var(--ink-2)\" : w > 0 ? (stark ? \"var(--brand-on-ink)\" : \"rgba(46,134,246,.22)\") : \"var(--ink-3)\"};border:1px solid ${leer ? \"var(--ink-line)\" : \"transparent\"};color:${w > 0 ? (stark ? \"#fff\" : \"var(--brand-on-ink)\") : \"var(--on-ink-muted)\"}` }; });\n    const todos = [[\"Connect a demo account\", true], [\"Size a first trade in R\", true], [\"Read the limit display\", false], [\"Attach a firm rule profile\", false], [\"Pair your phone\", false], [\"Save a workspace\", false]].map(([name, ok]) => ({\n      name, hak: ok ? \"✓\" : \"\", stil: `display:flex;align-items:center;gap:9px;color:${ok ? \"var(--on-ink-faint)\" : \"var(--on-ink)\"};${ok ? \"text-decoration:line-through\" : \"\"}`,\n      box: `width:15px;height:15px;display:grid;place-items:center;border-radius:4px;font-size:10px;${ok ? \"background:var(--brand-on-ink);color:#fff\" : \"border:1px solid var(--ink-line-2)\"}`\n    }));\n\n    return {\n      navi, lanes, menueOffen, menueZu: () => !istBanner && menueOffen && this.setState({ menueOffen: false }),\n      istBanner, istSeite, s, ist, nachbarn, alleSeiten: FEATURE,\n      kerzen, kerzenKlein, fib, werkzeuge, konten, rollen, replayKnoepfe, plan, ergebnis, kpis, monat, todos\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
