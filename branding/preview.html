<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>FixedR — G1-Vorschau Wortmarke & Palette</title>
<style>
  body{background:#0B0E14;color:#E6E9F0;font-family:Segoe UI,system-ui,sans-serif;margin:2rem auto;max-width:1080px;padding:0 1rem}
  h1{font-weight:600} h2{margin-top:2.2rem;font-weight:500;color:#8B93A7}
  .chip{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-left:.4em}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.2rem}
  figure{margin:0;background:#121722;border:1px solid #2A3242;border-radius:8px;padding:1.2rem}
  .stage{display:flex;align-items:center;min-height:110px} .stage img{max-width:100%}
  .stage.small{min-height:36px;border-top:1px dashed #2A3242;padding-top:.6rem}
  figcaption{color:#8B93A7;font-size:.85rem;margin-top:.5rem}
  p.hint{color:#8B93A7}
</style></head><body>
<h1>FixedR — Gate G1: Wortmarke &amp; Palette wählen</h1>
<p class="hint">Jede Karte: groß + klein (22 px — Avatar-/Favicon-Tauglichkeit). Hintergrund = Site-Hintergrund <code>#0B0E14</code>.</p>

  <h2>Palette „Amber — Avionik-Warnlicht (warm)"
    <span class="chip" style="background:#FFB000"></span></h2>
  <div class="row">
  <figure>
    <div class="stage"><img src="wortmarke/v1-amber.svg" alt="V1 — Mono, betontes R (JetBrains Mono)"></div>
    <div class="stage small"><img src="wortmarke/v1-amber.svg" height="22" alt=""></div>
    <figcaption>V1 — Mono, betontes R (JetBrains Mono)</figcaption>
  </figure>
  <figure>
    <div class="stage"><img src="wortmarke/v2-amber.svg" alt="V2 — R als Rundinstrument"></div>
    <div class="stage small"><img src="wortmarke/v2-amber.svg" height="22" alt=""></div>
    <figcaption>V2 — R als Rundinstrument</figcaption>
  </figure>
  <figure>
    <div class="stage"><img src="wortmarke/v3-amber.svg" alt="V3 — reine Typo mit Ankerlinie unterm R (Inter)"></div>
    <div class="stage small"><img src="wortmarke/v3-amber.svg" height="22" alt=""></div>
    <figcaption>V3 — reine Typo mit Ankerlinie unterm R (Inter)</figcaption>
  </figure></div>
  <h2>Palette „Cyan — Glass-Cockpit (kühl)"
    <span class="chip" style="background:#3FC6DC"></span></h2>
  <div class="row">
  <figure>
    <div class="stage"><img src="wortmarke/v1-cyan.svg" alt="V1 — Mono, betontes R (JetBrains Mono)"></div>
    <div class="stage small"><img src="wortmarke/v1-cyan.svg" height="22" alt=""></div>
    <figcaption>V1 — Mono, betontes R (JetBrains Mono)</figcaption>
  </figure>
  <figure>
    <div class="stage"><img src="wortmarke/v2-cyan.svg" alt="V2 — R als Rundinstrument"></div>
    <div class="stage small"><img src="wortmarke/v2-cyan.svg" height="22" alt=""></div>
    <figcaption>V2 — R als Rundinstrument</figcaption>
  </figure>
  <figure>
    <div class="stage"><img src="wortmarke/v3-cyan.svg" alt="V3 — reine Typo mit Ankerlinie unterm R (Inter)"></div>
    <div class="stage small"><img src="wortmarke/v3-cyan.svg" height="22" alt=""></div>
    <figcaption>V3 — reine Typo mit Ankerlinie unterm R (Inter)</figcaption>
  </figure></div>
</body></html>
